[package]
name = "oars_ristretto"
version = "0.1.0"
edition = "2021"

[dependencies]
bulletproofs = "5"
curve25519-dalek = { version = "4", features = ["rand_core", "digest"] }
merlin = "3"
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
subtle = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
